name: Build macOS App

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - 'v*'  # 当推送版本标签时自动构建

jobs:
  build:
    runs-on: macos-latest  # 使用 macOS 运行器
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'  # 使用 3.10 更稳定
    
    - name: Display Python version
      run: |
        python --version
        which python
    
    - name: List files
      run: |
        ls -la
        echo "---"
        ls -la *.py || echo "No Python files found"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || echo "Failed to install from requirements.txt"
        pip install pyinstaller
        pip list | grep -E "(pandas|selenium|pyinstaller)"
    
    - name: Check build script exists
      run: |
        if [ -f "build_mac.py" ]; then
          echo "✓ build_mac.py exists"
          head -20 build_mac.py
        else
          echo "✗ build_mac.py not found"
          ls -la *.py
          exit 1
        fi
    
    - name: Build macOS app
      run: |
        echo "开始构建 macOS 应用..."
        echo "当前目录: $(pwd)"
        echo "Python 版本: $(python --version)"
        
        # 直接使用 PyInstaller，不依赖构建脚本
        pyinstaller \
          --name="Shop工具合集" \
          --onedir \
          --windowed \
          --hidden-import=pandas \
          --hidden-import=openpyxl \
          --hidden-import=selenium \
          --hidden-import=webdriver_manager \
          --hidden-import=tqdm \
          --hidden-import=dnspython \
          --hidden-import=dns \
          --hidden-import=phonenumbers \
          --hidden-import=tkinter \
          --hidden-import=tkinter.ttk \
          --hidden-import=tkinter.filedialog \
          --hidden-import=tkinter.messagebox \
          --hidden-import=data_cleaner \
          --hidden-import=shopify_partners_scraper_auto \
          --hidden-import=shop_contact_scraper_google_login_v7_7 \
          --collect-all=selenium \
          --collect-all=webdriver_manager \
          --collect-all=phonenumbers \
          --collect-all=dnspython \
          --noconfirm \
          shop_tools_gui.py
        
        echo "构建完成，检查输出..."
        ls -la dist/ || echo "dist 文件夹不存在"
    
    - name: Check build output
      run: |
        echo "Checking dist folder..."
        ls -la dist/ || echo "dist folder not found"
        if [ -d "dist/Shop工具合集.app" ]; then
          echo "✓ App bundle created"
          du -sh dist/Shop工具合集.app
        else
          echo "✗ App bundle not found"
          ls -la dist/ || true
        fi
    
    - name: Create DMG (optional)
      continue-on-error: true
      run: |
        if [ -f "create_dmg.py" ] && [ -d "dist/Shop工具合集.app" ]; then
          python create_dmg.py || echo "DMG creation failed, but continuing..."
        else
          echo "Skipping DMG creation"
        fi
    
    - name: Upload app bundle
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: Shop工具合集-macOS
        path: |
          dist/Shop工具合集.app
          dist/Shop工具合集.dmg
        if-no-files-found: warn
        retention-days: 7
    
    - name: Upload build logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/
          *.log
        if-no-files-found: ignore
        retention-days: 1
